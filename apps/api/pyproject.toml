[project]
name = "sarap-api"
version = "0.1.0"
description = "SARAP platform API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy>=2.0.36",
  "alembic>=1.14",
  "pydantic-settings>=2.6",
  "pydantic[email]>=2.10",
  "pyjwt>=2.10",
  "bcrypt>=4.2",
  "httpx>=0.27",
  "psycopg[binary]>=3.2",
  "shapely>=2.0",
  "pyproj>=3.6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]


[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]
