services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: sarap
      POSTGRES_PASSWORD: sarap
      POSTGRES_DB: sarap
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sarap -d sarap"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: sarap
      MINIO_ROOT_PASSWORD: sarap-dev-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      SARAP_DATABASE_URL: postgresql+psycopg://sarap:sarap@postgres:5432/sarap
      SARAP_SECRET_KEY: change-me-dev-only
      SARAP_ENGINE_URL: http://engine:8081
      SARAP_ENGINE_TOKEN: dev-internal-token
      SARAP_INTERNAL_TOKEN: dev-internal-token
      SARAP_CORS_ORIGINS: http://localhost:5173
      SARAP_SEED_ON_STARTUP: "true"
      SARAP_S3_ENDPOINT: http://minio:9000
      SARAP_S3_ACCESS_KEY: sarap
      SARAP_S3_SECRET_KEY: sarap-dev-secret
      SARAP_S3_BUCKET: sarap
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Internal control plane. Mock by default; does not download Sentinel-1
  # and does not write platform business tables.
  #   docker compose --profile engine up --build
  engine:
    profiles: ["engine"]
    build:
      context: .
      dockerfile: engine/Dockerfile
    environment:
      SARAP_ENGINE_MODE: mock
      SARAP_ENGINE_INGEST_MODE: http
      SARAP_ENGINE_WORKER: "true"
      SARAP_ENGINE_REDIS_URL: redis://redis:6379/0
      SARAP_ENGINE_WORK_DIR: /data/engine-work
      SARAP_ENGINE_DB_URL: sqlite:////data/engine-work/engine-jobs.sqlite
      SARAP_ENGINE_PLATFORM_INGEST_URL: http://api:8000/api/v1/internal/products
      SARAP_ENGINE_TOKEN: dev-internal-token
      SARAP_INTERNAL_TOKEN: dev-internal-token
    ports:
      - "8081:8081"
    volumes:
      - engine-work:/data/engine-work
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api/v1
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  postgres-data:
  minio-data:
  engine-work:
